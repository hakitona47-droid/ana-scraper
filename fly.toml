# fly.toml app configuration file generated for ana2 on 2026-09-04T15:37:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "ana2"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8078"

[http_service]
  internal_port = 8078
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
  processes = ['app']
  size = 'shared-cpu-1x'
